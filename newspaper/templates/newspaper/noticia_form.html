<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noticia — Chicago Daily News</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #d9d0c0; display: flex; justify-content: center; padding: 2rem; min-height: auto; }
.panel { background: #f5f0e8; color: #1a1008; font-family: 'IM Fell English', Georgia, serif; padding: 0 0 2rem; border: 1px solid #c8b89a; max-width: 900px; width: 100%; box-shadow: 4px 4px 20px rgba(0,0,0,0.25); }
.cabecera { border-bottom: 4px double #1a1008; padding: 1.25rem 2rem 0.75rem; text-align: center; background: #ede8dc; }
.nombre-periodico { font-family: 'UnifrakturMaguntia', cursive; font-size: 60px; line-height: 1; color: #0d0700; }
.linea-roja { height: 5px; background: #8b1a1a; }
.nav-panel { display: flex; justify-content: space-between; align-items: center; padding: 8px 2rem; background: #ede8dc; border-bottom: 1px solid #c8b89a; font-family: 'Playfair Display', serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; }
.nav-panel a { color: #8b1a1a; text-decoration: none; }
.nav-panel a:hover { text-decoration: underline; }
.cuerpo { padding: 2rem; }
h1 { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 900; color: #0d0700; border-bottom: 2px solid #1a1008; padding-bottom: 1rem; margin-bottom: 1.5rem; }
.campo { margin-bottom: 1.2rem; }
label { font-family: 'Playfair Display', serif; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: #555; display: block; margin-bottom: 4px; }
input[type="text"], input[type="file"] { width: 100%; padding: 8px 10px; border: 1px solid #c8b89a; background: #ede8dc; font-family: 'IM Fell English', Georgia, serif; font-size: 14px; color: #1a1008; outline: none; }
.btn-guardar { background: #8b1a1a; color: #f5f0e8; padding: 10px 24px; font-family: 'Playfair Display', serif; font-size: 13px; letter-spacing: 0.15em; text-transform: uppercase; border: none; cursor: pointer; margin-right: 10px; }
.btn-guardar:hover { background: #6d1414; }
.btn-cancelar { color: #8b1a1a; font-family: 'Playfair Display', serif; font-size: 11px; text-transform: uppercase; text-decoration: none; letter-spacing: 0.1em; }
.imagen-actual { margin-bottom: 8px; }
.imagen-actual img { max-height: 120px; border: 1px solid #c8b89a; }

/* QUILL estilo periódico */
.ql-toolbar { background: #ede8dc; border: 1px solid #c8b89a !important; border-bottom: none !important; }
.ql-container { background: #ede8dc; border: 1px solid #c8b89a !important; min-height: 250px; }
.ql-editor { font-family: 'IM Fell English', Georgia, serif; font-size: 14px; color: #1a1008; line-height: 1.7; min-height: 250px; }
.ql-editor.ql-blank::before { color: #aaa; font-style: italic; }
</style>
</head>
<body>
<div class="panel">
  <div class="cabecera">
    <div style="border-top: 1px solid #999; margin-bottom: 0.4rem;"></div>
    <div class="nombre-periodico">Chicago Daily News</div>
    <div style="font-family:Georgia,serif; font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:#666; border-top:1px solid #999; border-bottom:1px solid #999; padding:3px 0; margin-top:0.3rem;">Panel de Redacción</div>
  </div>
  <div class="linea-roja"></div>
  <div class="nav-panel">
    <span><a href="/panel/">← Panel</a> · <a href="/panel/noticias/">Noticias</a> · {% if noticia %}Editar{% else %}Nueva{% endif %}</span>
    <a href="/logout/">Cerrar sesión</a>
  </div>
  <div class="cuerpo">
    <h1>{% if noticia %}Editar Noticia{% else %}Nueva Noticia{% endif %}</h1>
    <form id="form-noticia" method="POST" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="campo">
        <label>Título</label>
        <input type="text" name="titulo" value="{{ noticia.titulo|default:'' }}" required>
      </div>
      <div class="campo">
        <label>Contenido</label>
        <div id="quill-editor"></div>
        <input type="hidden" name="contenido" id="contenido-hidden">
      </div>
      <div class="campo">
        <label>Imagen</label>
        {% if noticia.imagen %}
        <div class="imagen-actual">
          <p style="font-size:11px; color:#888; margin-bottom:4px;">Imagen actual:</p>
          <img src="{{ noticia.imagen.url }}" alt="{{ noticia.titulo }}">
        </div>
        {% endif %}
        <input type="file" name="imagen" accept="image/*">
      </div>
      <button type="submit" class="btn-guardar">Guardar Noticia</button>
      <a href="/panel/noticias/" class="btn-cancelar">Cancelar</a>
    </form>
  </div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
<script>
  const quill = new Quill('#quill-editor', {
    theme: 'snow',
    placeholder: 'Escribe el contenido de la noticia...',
    modules: {
      toolbar: [
        ['bold', 'italic', 'underline'],
        [{ 'color': [] }],
        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
        ['link', 'image'],
        ['clean']
      ]
    }
  });

  {% if noticia %}
  quill.clipboard.dangerouslyPasteHTML(`{{ noticia.contenido|escapejs }}`);
  {% endif %}

  document.getElementById('form-noticia').addEventListener('submit', function() {
    document.getElementById('contenido-hidden').value = quill.root.innerHTML;
  });
</script>
</body>
</html>
